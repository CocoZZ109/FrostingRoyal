name: Build FrostingRoyale
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q frostingroyale-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: gradle build --no-daemon
        working-directory: frostingroyale
      - uses: actions/upload-artifact@v4
        with:
          name: FrostingRoyale
          path: frostingroyale/build/libs/FrostingRoyale.jar
